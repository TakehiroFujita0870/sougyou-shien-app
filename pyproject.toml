[project]
name = "kadode-api"
version = "0.1.0"
description = "Kadode deterministic product API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "typing-extensions>=4.15.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = ["pytest>=8.4.1", "httpx>=0.28.1", "pypdf>=6.0.0", "pymupdf>=1.27.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
