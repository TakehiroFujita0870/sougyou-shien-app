[project]
name = "dots"
version = "0.1.0"
description = "Dots. deterministic product API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "neo4j>=5.26,<6",
    "typing-extensions>=4.15.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
local-rag = ["sentence-transformers>=5.1,<6", "torch>=2.6"]

[dependency-groups]
dev = ["pytest>=8.4.1", "httpx>=0.28.1", "pypdf>=6.0.0", "pymupdf>=1.27.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
