name: ${FOUNDER_GRAPH_COMPOSE_PROJECT:-founder-graph-local}

services:
  neo4j:
    image: neo4j:5.26-community
    pull_policy: never
    environment:
      NEO4J_AUTH_FILE: /run/secrets/founder_graph_auth
      NEO4J_server_http_advertised__address: "localhost:7474"
      NEO4J_server_bolt_advertised__address: "localhost:7687"
    secrets:
      - founder_graph_auth
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - founder_graph_neo4j_data:/data
    networks:
      - founder_graph_local
      - founder_graph_host
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export NEO4J_USERNAME="$$(cut -d/ -f1 /run/secrets/founder_graph_auth)";
          export NEO4J_PASSWORD="$$(cut -d/ -f2- /run/secrets/founder_graph_auth)";
          test -n "$$NEO4J_USERNAME" && test -n "$$NEO4J_PASSWORD" &&
          cypher-shell --address localhost:7687
          "RETURN 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 1m

volumes:
  founder_graph_neo4j_data:
    labels:
      com.openai.founder_graph.role: live
      com.openai.founder_graph.database: neo4j

networks:
  founder_graph_local:
    internal: true
  # The local-only network keeps container-to-container traffic private. The
  # second, project-scoped network is needed because Docker does not publish
  # ports from an internal-only network on Docker Desktop.
  founder_graph_host: {}

secrets:
  founder_graph_auth:
    file: ${FOUNDER_GRAPH_NEO4J_AUTH_FILE:?Set FOUNDER_GRAPH_NEO4J_AUTH_FILE to a temporary auth secret file}
