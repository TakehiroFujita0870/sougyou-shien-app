name: CI
on: [pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test
      - run: npm run test:a11y
      - run: npm run build
      - run: npm run build-storybook
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Record desktop happy-path E2E
        run: npm run test:video
      - name: Verify desktop sidebar portfolio E2E
        run: npx playwright test tests/e2e/sidebar-portfolio.spec.js
      - name: Verify recorded WebM
        run: test -n "$(find test-results -type f -name '*.webm' -size +0c -print -quit)"
      - name: Upload desktop E2E video
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kadode-desktop-e2e-video
          path: test-results/**/*.webm
          if-no-files-found: error
      - name: Upload desktop sidebar screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kadode-sidebar-1440-screenshot
          path: test-results/sidebar-portfolio-1440x900.png
          if-no-files-found: error
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - run: uv run pytest
