name: CI
on: [pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test
      - name: Generate and inspect formal-plan PDF
        run: KADODE_PDF_QA_PATH=test-results/formal-plan.pdf npm test -- --run src/components/formalPlanPdfAdapter.test.js
      - run: npm run test:a11y
      - run: npm run build
      - run: npm run build-storybook
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Storybook production-theme parity
        run: npm run test:storybook-visual
      - name: Record desktop happy-path E2E
        run: npm run test:video
      - name: Verify desktop sidebar portfolio E2E
        run: npx playwright test tests/e2e/sidebar-portfolio.spec.js
      - name: Verify recorded WebM
        run: test -n "$(find test-results -type f -name '*.webm' -size +0c -print -quit)"
      - name: Upload desktop E2E video
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kadode-desktop-e2e-video
          path: test-results/**/*.webm
          if-no-files-found: error
      - name: Upload desktop sidebar screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kadode-sidebar-1440-screenshot
          path: test-results/sidebar-portfolio-1440x900.png
          if-no-files-found: error
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - name: Verify formal-plan Japanese text and render every PDF page
        run: uv run python scripts/verify-formal-plan-pdf.py test-results/formal-plan.pdf test-results/formal-plan-png
      - name: Upload formal-plan PDF visual QA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kadode-formal-plan-pdf-qa
          path: |
            test-results/formal-plan.pdf
            test-results/formal-plan-png/*.png
          if-no-files-found: error
      - run: uv run pytest
